name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/absmach/propeller-k8s-operator

jobs:
  docker:
    name: Docker Build and Push (versioned)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Compute build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build consolidated installer manifest
        run: make build-installer IMG=${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/install.yaml
          generate_release_notes: true
          body: |
            ## Docker Image

            A multi-architecture Docker image (linux/amd64, linux/arm64) is available on GHCR:

            ```
            docker pull ghcr.io/absmach/propeller-k8s-operator:${{ github.ref_name }}
            docker pull ghcr.io/absmach/propeller-k8s-operator:latest
            ```

            Images are tagged with the release version (e.g., `${{ github.ref_name }}`) and `:latest` tracks the most recent commit on `main`.

            ## Quick Start

            1. Install the CRDs and operator in one shot using the consolidated `install.yaml` release asset:

               ```bash
               kubectl apply -f install.yaml
               ```

               By default the operator starts with no MQTT broker configured. Patch in your connection details:

               ```bash
               kubectl patch deployment propeller-k8s-operator-controller-manager \
                 -n propeller-k8s-operator-system --type=json \
                 -p '[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--mqtt-address=tcp://your-mqtt:1883"},
                      {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--tenant-id=<tenant>"},
                      {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--channel-id=<channel>"},
                      {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--entity-id=<entity>"},
                      {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--api-key=<api-key>"}]'
               ```

            2. Register a proplet and run a WASM task — grab `config/samples/propeller_v1_proplet.yaml` and `propeller_v1_task.yaml` from the [repo](https://github.com/absmach/propeller-k8s-operator/tree/${{ github.ref_name }}/config/samples), fill in your credentials, then:

               ```bash
               kubectl apply -f propeller_v1_proplet.yaml
               kubectl apply -f propeller_v1_task.yaml
               kubectl get task wasm-addition -w
               ```

            For the full set of samples (compute, HTTP, attestation, TEE, WASI-NN, DAG, ...) and everything else, see the [README](https://github.com/absmach/propeller-k8s-operator/blob/${{ github.ref_name }}/README.md).
