# Requires a Proplet with spec.k8s.env.externalWasmRuntime: "" and
# spec.k8s.env.halEnabled: true (see propeller_v1_proplet_full.yaml).
# Without real TEE hardware (TDX/SEV), expect a result like:
#   "attestation: failed (no TEE platform available for attestation)"
# — that's the expected stub behavior, not a failure.
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: attestation-test-example
spec:
  name: attestation-test-example
  functionName: run-attestation
  kind: standard
  file: ""
  daemon: false
  propletSelector:
    propletId: "k8s-proplet-full"
