# Requires the registry proxy service running and reachable by both the
# operator and the target proplet on the same tenant/channel — see
# propeller_proxy_deployment.yaml. Without it, the proplet's registry
# request for imageUrl never gets a chunk response and the Task stays at
# phase: running indefinitely.
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: wasm-addition-from-registry
spec:
  name: wasm-addition-from-registry
  functionName: add
  kind: standard
  imageUrl: "docker.io/mrstevenyaga/add.wasm:latest"
  inputs:
    - 10
    - 89
  mode: infer
  daemon: false
  priority: 50
  propletSelector:
    propletId: "external-proplet"
