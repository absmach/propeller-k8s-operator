# Requires PROPLET_DIRS=/tmp set on the proplet process itself (preopens
# that directory for WASI filesystem access). There is currently no
# equivalent field on K8sPropletSpec.Env, so this only works targeting an
# external proplet where you control the process environment directly —
# see propeller_v1_proplet_external.yaml and set PROPLET_DIRS=/tmp before
# starting it.
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: filesystem-example
spec:
  name: filesystem-example
  functionName: _start
  kind: standard
  file: ""
  daemon: false
  propletSelector:
    propletId: "external-proplet"
