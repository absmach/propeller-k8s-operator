# Task sample — runs an addition WASM module on the external-proplet.
# The WASM binary is embedded as a base64-encoded string; the proplet decodes and
# executes it with Wasmtime, returning the result via MQTT to the operator.
#
# For a full walkthrough including credential provisioning and expected output, see:
# https://propeller.absmach.eu/docs/examples/kubernetes-operator
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: wasm-addition
spec:
  name: wasm-addition
  functionName: main
  # Base64-encoded WASM binary: an addition module that exports main(a, b int32) int32
  file: "AGFzbQEAAAABBwFgAn9/AX8DAgEABwgBBG1haW4AAAoJAQcAIAAgAWoL"
  inputs:
    - 10
    - 32
  propletSelector:
    propletId: "external-proplet"
