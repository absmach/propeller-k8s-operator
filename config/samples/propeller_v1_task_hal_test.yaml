# Requires a Proplet with spec.k8s.env.externalWasmRuntime: "" and
# spec.k8s.env.halEnabled: true (see propeller_v1_proplet_full.yaml).
# Exercises the HAL crypto/random/clock stubs; produces real output even
# without TEE hardware.
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: hal-test-example
spec:
  name: hal-test-example
  functionName: run-hal-test
  kind: standard
  file: ""
  daemon: false
  propletSelector:
    propletId: "k8s-proplet-full"
