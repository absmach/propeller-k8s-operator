# Kubernetes Proplet sample — runs the proplet as a pod managed by the operator
# inside the cluster. The operator creates and manages the underlying Deployment.
#
# For a full walkthrough including credential provisioning and task execution, see:
# https://propeller.absmach.eu/docs/examples/kubernetes-operator
apiVersion: propeller.propeller.abstractmachines.fr/v1
kind: Proplet
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: k8s-proplet
spec:
  type: k8s
  k8s:
    image: "ghcr.io/absmach/propeller/proplet:latest"
    logLevel: info
    replicas: 1
  connectionConfig:
    tenantId: "<your-tenant-id>"
    channelId: "<your-channel-id>"
    entityId: "<your-proplet-entity-id>"
    apiKey: "<your-proplet-api-key>"
    mqttAddress: "tcp://<your-mqtt-broker>:1883"
    mqttQos: 0
    mqttTimeout: 30s
  resources:
    cpu: "50m"
    memory: "128Mi"
