apiVersion: propeller.propeller.abstractmachines.fr/v1
kind: Proplet
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: <your-external-proplet-name>
spec:
  connectionConfig:
    channelId: "<your-channel-id>"
    clientId: "<your-client-id>"
    clientKey: "<your-client-key>"
    domainId: "<your-domain-id>"
    mqttAddress: "<your-mqtt-address>"
    mqttQos: 1
    mqttTimeout: 10s
  external:
    deviceType: "<your-device-type>"
    capabilities:
      - "<your-capability-1>"
      - "<your-capability-2>"
  resources:
    cpu: 50m
    memory: 128Mi
  type: external
