# External Proplet sample — registers a proplet running outside the cluster (e.g. a
# Docker container or edge device) with the operator via MQTT.
#
# For a full walkthrough including credential provisioning and task execution, see:
# https://propeller.absmach.eu/docs/examples/kubernetes-operator
apiVersion: propeller.propeller.abstractmachines.fr/v1
kind: Proplet
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: external-proplet
spec:
  type: external
  external:
    deviceType: "docker-container"
    capabilities:
      - wasm
      - wasmtime
  connectionConfig:
    domainId: "<your-domain-id>"
    channelId: "<your-channel-id>"
    clientId: "<your-proplet-client-id>"
    clientKey: "<your-proplet-client-key>"
    mqttAddress: "tcp://localhost:1883"
    mqttQos: 0
    mqttTimeout: 30s
