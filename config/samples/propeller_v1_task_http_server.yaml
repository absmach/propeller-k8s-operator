# Requires a Proplet with spec.k8s.env.httpEnabled: true (see
# propeller_v1_proplet_full.yaml). This is a daemon task: the proplet
# reports completion as soon as the listener starts, not when it stops.
# Verify it's actually serving with:
#   kubectl port-forward deploy/k8s-proplet-proplet 18044:8044
#   curl http://localhost:18044/
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: http-server-example
spec:
  name: http-server-example
  functionName: _start
  kind: standard
  file: ""
  cliArgs:
    - "--port"
    - "8044"
  daemon: true
  propletSelector:
    propletId: "k8s-proplet-full"
