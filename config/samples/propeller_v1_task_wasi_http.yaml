# Requires PROPLET_EXTERNAL_WASM_RUNTIME="", PROPLET_HTTP_ENABLED=true, and
# PROPLET_HTTP_PROXY_PORT set on the proplet process itself. Only
# PROPLET_HTTP_ENABLED has a K8sPropletSpec.Env equivalent
# (k8s.env.httpEnabled) — PROPLET_HTTP_PROXY_PORT does not, so this only
# works targeting an external proplet where you control the process
# environment directly — see propeller_v1_proplet_external.yaml.
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: wasi-http-example
spec:
  name: wasi-http-example
  functionName: _start
  kind: standard
  file: ""
  daemon: true
  propletSelector:
    propletId: "external-proplet"
