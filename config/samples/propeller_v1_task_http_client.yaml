# Requires a Proplet with spec.k8s.env.httpEnabled: true (see
# propeller_v1_proplet_full.yaml). Makes real outbound HTTP requests to
# httpbin.org from the proplet.
#
# This module's base64 encoding is close to 400KB. Apply with
# --server-side to avoid kubectl's client-side last-applied-configuration
# annotation, which would duplicate this content and can exceed
# Kubernetes' 256KiB single-annotation limit:
#   kubectl apply --server-side -f propeller_v1_task_http_client.yaml
apiVersion: propeller.propeller.absmach.eu/v1
kind: Task
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: http-client-example
spec:
  name: http-client-example
  functionName: _start
  kind: standard
  file: ""
  daemon: false
  propletSelector:
    propletId: "k8s-proplet-full"
