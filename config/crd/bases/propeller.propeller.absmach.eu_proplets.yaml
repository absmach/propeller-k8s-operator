---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: proplets.propeller.propeller.absmach.eu
spec:
  group: propeller.propeller.absmach.eu
  names:
    kind: Proplet
    listKind: PropletList
    plural: proplets
    singular: proplet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.taskCount
      name: Tasks
      type: integer
    - jsonPath: .status.k8sStatus.readyReplicas
      name: Replicas
      type: string
    - jsonPath: .status.lastSeen
      name: Last Seen
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Proplet is the Schema for the proplets API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Proplet
            properties:
              connectionConfig:
                description: ConnectionConfig defines the MQTT connection configuration
                  for a Proplet.
                properties:
                  apiKey:
                    description: |-
                      APIKey is the MQTT API key. Exactly one of APIKey or
                      APIKeySecretRef must be set.
                    type: string
                  apiKeySecretRef:
                    description: |-
                      APIKeySecretRef references a Kubernetes Secret whose key holds the
                      MQTT API key. Exactly one of APIKey or APIKeySecretRef must
                      be set.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                  channelId:
                    minLength: 1
                    type: string
                  entityId:
                    minLength: 1
                    type: string
                  mqttAddress:
                    type: string
                  mqttQos:
                    default: 0
                    maximum: 2
                    minimum: 0
                    type: integer
                  mqttTimeout:
                    default: 30s
                    type: string
                  tenantId:
                    minLength: 1
                    type: string
                required:
                - channelId
                - entityId
                - mqttAddress
                - tenantId
                type: object
              external:
                properties:
                  capabilities:
                    items:
                      type: string
                    type: array
                  deviceType:
                    description: DeviceType specifies the type of external device
                      (e.g., esp32, raspberry-pi)
                    type: string
                type: object
              k8s:
                description: K8sPropletSpec defines the configuration for a Kubernetes-backed
                  Proplet.
                properties:
                  env:
                    description: Env holds optional environment overrides for the
                      proplet container.
                    properties:
                      aaConfigPath:
                        description: AaConfigPath sets PROPLET_AA_CONFIG_PATH for
                          confidential computing.
                        type: string
                      description:
                        description: Description sets PROPLET_DESCRIPTION.
                        type: string
                      externalWasmRuntime:
                        description: ExternalWasmRuntime sets PROPLET_EXTERNAL_WASM_RUNTIME
                          (path to wasmtime binary).
                        type: string
                      halEnabled:
                        description: HalEnabled sets PROPLET_HAL_ENABLED.
                        type: boolean
                      httpEnabled:
                        description: HttpEnabled sets PROPLET_HTTP_ENABLED.
                        type: boolean
                      kbsUri:
                        description: KbsURI sets PROPLET_KBS_URI for confidential
                          computing.
                        type: string
                      livelinessInterval:
                        description: LivelinessInterval sets PROPLET_LIVELINESS_INTERVAL
                          (default 10s).
                        type: string
                      location:
                        description: Location sets PROPLET_LOCATION.
                        type: string
                      metricsEnabled:
                        description: MetricsEnabled sets PROPLET_METRICS_ENABLED (default
                          true).
                        type: boolean
                      metricsInterval:
                        description: MetricsInterval sets PROPLET_METRICS_INTERVAL
                          (default 10s).
                        type: string
                      metricsPort:
                        description: MetricsPort sets PROPLET_METRICS_PORT (default
                          9092).
                        format: int32
                        type: integer
                      mqttTlsCaCert:
                        description: MqttTLSCACert sets PROPLET_MQTT_TLS_CA_CERT.
                        type: string
                      mqttTlsClientCert:
                        description: MqttTLSClientCert sets PROPLET_MQTT_TLS_CLIENT_CERT.
                        type: string
                      mqttTlsClientKey:
                        description: MqttTLSClientKey sets PROPLET_MQTT_TLS_CLIENT_KEY.
                        type: string
                      mqttTlsInsecureSkipVerify:
                        description: MqttTLSInsecureSkipVerify sets PROPLET_MQTT_TLS_INSECURE_SKIP_VERIFY.
                        type: boolean
                      otelUrl:
                        description: OtelURL sets PROPLET_OTEL_URL for OpenTelemetry.
                        type: string
                      tags:
                        description: Tags sets PROPLET_TAGS as a comma-separated list.
                        type: string
                      traceRatio:
                        description: TraceRatio sets PROPLET_TRACE_RATIO as a string
                          (e.g. "0.5").
                        type: string
                      usbEnabled:
                        description: UsbEnabled sets PROPLET_USB_ENABLED.
                        type: boolean
                    type: object
                  image:
                    minLength: 1
                    type: string
                  logLevel:
                    default: info
                    enum:
                    - debug
                    - info
                    - warn
                    - error
                    type: string
                  pluginDir:
                    description: |-
                      PluginDir is the path inside the proplet container where WASM plugin files are loaded from.
                      Maps to the PROPLET_PLUGIN_DIR environment variable. Leave empty to disable plugins.
                    type: string
                  replicas:
                    default: 1
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - image
                type: object
              resources:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: string
                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                  x-kubernetes-int-or-string: true
                description: ResourceList is a set of (resource name, quantity) pairs.
                type: object
              type:
                allOf:
                - enum:
                  - k8s
                  - external
                  - any
                - enum:
                  - k8s
                  - external
                type: string
            required:
            - connectionConfig
            - type
            type: object
          status:
            description: status defines the observed state of Proplet
            properties:
              alive:
                type: boolean
              aliveHistory:
                description: AliveHistory stores recent heartbeat timestamps for liveness
                  tracking
                items:
                  format: date-time
                  type: string
                type: array
              availableResources:
                properties:
                  cpu:
                    description: CPU capacity (e.g., "1000m" for 1 CPU core)
                    pattern: ^([0-9]+(\.[0-9]*)?(m|))|([0-9]+m?)$
                    type: string
                  custom:
                    additionalProperties:
                      type: string
                    description: Custom resource constraints
                    type: object
                  memory:
                    description: Memory capacity (e.g., "1Gi")
                    pattern: ^[0-9]+(\.[0-9]*)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$
                    type: string
                type: object
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      enum:
                      - Ready
                      - Connected
                      - Healthy
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              k8sStatus:
                properties:
                  availableReplicas:
                    format: int32
                    minimum: 0
                    type: integer
                  readyReplicas:
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - availableReplicas
                - readyReplicas
                type: object
              lastSeen:
                format: date-time
                type: string
              latestMetrics:
                description: LatestMetrics is the most recent metrics sample received
                  from the proplet.
                properties:
                  cpuMilliPercent:
                    description: CPUMilliPercent is CPU utilisation × 1000 (e.g. 50000
                      = 50 %).
                    format: int64
                    type: integer
                  memoryBytes:
                    format: int64
                    type: integer
                  memoryMilliPercent:
                    description: MemoryMilliPercent is memory utilisation × 1000.
                    format: int64
                    type: integer
                  timestamp:
                    format: date-time
                    type: string
                type: object
              metadata:
                description: Metadata holds runtime information reported by the proplet
                  over MQTT.
                properties:
                  cpuArch:
                    type: string
                  description:
                    type: string
                  environment:
                    type: string
                  hostname:
                    type: string
                  ip:
                    type: string
                  location:
                    type: string
                  os:
                    type: string
                  propletVersion:
                    type: string
                  tags:
                    items:
                      type: string
                    type: array
                  totalMemoryBytes:
                    format: int64
                    type: integer
                  wasmRuntime:
                    type: string
                type: object
              phase:
                default: Initializing
                enum:
                - Initializing
                - Running
                - Offline
                type: string
              taskCount:
                default: 0
                format: int64
                type: integer
            required:
            - alive
            - phase
            - taskCount
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
