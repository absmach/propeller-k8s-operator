---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: tasks.propeller.propeller.abstractmachines.fr
spec:
  group: propeller.propeller.abstractmachines.fr
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.assignedProplet
      name: Proplet
      type: string
    - jsonPath: .status.startedAt
      name: Start Time
      type: date
    - jsonPath: .status.finishedAt
      name: Finish Time
      type: date
    - jsonPath: .spec.preferredPropletType
      name: Preferred Type
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Task is the Schema for the tasks API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Task
            properties:
              broadcast:
                description: |-
                  Broadcast sends the task to all available proplets simultaneously instead of a single selected one.
                  Mirrors task.Task.Broadcast in the propeller codebase.
                type: boolean
              cliArgs:
                items:
                  type: string
                type: array
              daemon:
                type: boolean
              dependsOn:
                description: |-
                  Workflow/DAG fields
                  DependsOn specifies task IDs that must complete before this task runs
                items:
                  type: string
                type: array
              encrypted:
                description: Confidential computing fields
                type: boolean
              env:
                additionalProperties:
                  type: string
                type: object
              file:
                format: byte
                type: string
              functionName:
                description: |-
                  FunctionName is the name of the WASM function to invoke. Optional; if
                  omitted the proplet uses the task Name as the function identifier, which
                  is the behaviour of the main propeller manager.
                type: string
              imageUrl:
                type: string
              inputs:
                description: |-
                  Inputs are task input arguments. Each element is a string but numeric
                  values are accepted and coerced — matching the FlexStrings behaviour of
                  the main propeller manager.
                items:
                  type: string
                type: array
              isRecurring:
                description: IsRecurring indicates if the task should repeat after
                  completion
                type: boolean
              jobId:
                description: JobID groups tasks into a job for batch execution
                type: string
              kbsResourcePath:
                type: string
              kind:
                allOf:
                - enum:
                  - standard
                  - federated
                - enum:
                  - standard
                  - federated
                default: standard
                type: string
              metadata:
                description: |-
                  Metadata is arbitrary key-value data attached to the task.
                  Must be valid JSON and under 64 KB. Mirrors task.Task.Metadata in the propeller codebase.
                x-kubernetes-preserve-unknown-fields: true
              mode:
                enum:
                - infer
                - train
                type: string
              monitoringProfile:
                description: MonitoringProfile defines monitoring configuration for
                  task execution
                properties:
                  collectCpu:
                    type: boolean
                  collectDiskIo:
                    type: boolean
                  collectFileDescriptors:
                    type: boolean
                  collectMemory:
                    type: boolean
                  collectThreads:
                    type: boolean
                  enabled:
                    type: boolean
                  exportToMqtt:
                    type: boolean
                  historySize:
                    type: integer
                  interval:
                    type: string
                  retainHistory:
                    type: boolean
                type: object
              name:
                maxLength: 253
                minLength: 1
                type: string
              preferredPropletType:
                allOf:
                - enum:
                  - k8s
                  - external
                  - any
                - enum:
                  - k8s
                  - external
                  - any
                default: any
                type: string
              priority:
                default: 50
                description: 'Priority (higher values = higher priority, default:
                  50)'
                maximum: 100
                minimum: 0
                type: integer
              propletSelector:
                properties:
                  matchCapabilities:
                    items:
                      type: string
                    type: array
                  matchDeviceTypes:
                    items:
                      type: string
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                  propletId:
                    type: string
                type: object
              resourceRequirements:
                properties:
                  cpu:
                    description: CPU capacity (e.g., "1000m" for 1 CPU core)
                    pattern: ^([0-9]+(\.[0-9]*)?(m|))|([0-9]+m?)$
                    type: string
                  custom:
                    additionalProperties:
                      type: string
                    description: Custom resource constraints
                    type: object
                  memory:
                    description: Memory capacity (e.g., "1Gi")
                    pattern: ^[0-9]+(\.[0-9]*)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$
                    type: string
                type: object
              restartPolicy:
                description: |-
                  RestartPolicy describes how the container should be restarted.
                  Only one of the following restart policies may be specified.
                  If none of the following policies is specified, the default one
                  is RestartPolicyAlways.
                type: string
              runIf:
                description: 'RunIf specifies when to run: "success" (default) or
                  "failure"'
                enum:
                - success
                - failure
                type: string
              schedule:
                description: |-
                  Scheduling fields
                  Schedule is a cron expression for recurring tasks
                type: string
              timezone:
                description: 'Timezone for schedule interpretation (default: UTC)'
                type: string
              workflowId:
                description: WorkflowID groups tasks into a workflow for DAG execution
                type: string
            required:
            - name
            type: object
          status:
            description: status defines the observed state of Task
            properties:
              assignedProplet:
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      enum:
                      - Scheduled
                      - Started
                      - Completed
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                format: date-time
                type: string
              error:
                type: string
              finishedAt:
                format: date-time
                type: string
              latestMetrics:
                description: LatestMetrics is the most recent metrics sample reported
                  by the proplet for this task.
                properties:
                  cpuMilliPercent:
                    description: CPUMilliPercent is CPU utilisation × 1000 (e.g. 50000
                      = 50 %).
                    format: int64
                    type: integer
                  memoryBytes:
                    format: int64
                    type: integer
                  memoryMilliPercent:
                    description: MemoryMilliPercent is memory utilisation × 1000.
                    format: int64
                    type: integer
                  timestamp:
                    format: date-time
                    type: string
                type: object
              nextRun:
                description: NextRun is the next scheduled execution time for recurring
                  tasks
                format: date-time
                type: string
              phase:
                default: pending
                enum:
                - pending
                - scheduled
                - running
                - completed
                - failed
                - skipped
                - interrupted
                type: string
              results:
                x-kubernetes-preserve-unknown-fields: true
              startedAt:
                format: date-time
                type: string
              updatedAt:
                format: date-time
                type: string
            required:
            - conditions
            - phase
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
