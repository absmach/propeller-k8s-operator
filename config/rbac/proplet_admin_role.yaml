# This rule is not used by the project propeller-k8s-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over propeller.propeller.abstractmachines.fr.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: propeller-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: proplet-admin-role
rules:
- apiGroups:
  - propeller.propeller.abstractmachines.fr
  resources:
  - proplets
  verbs:
  - '*'
- apiGroups:
  - propeller.propeller.abstractmachines.fr
  resources:
  - proplets/status
  verbs:
  - get
