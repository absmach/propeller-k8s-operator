---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - propeller.propeller.absmach.eu
  resources:
  - federatedjobs
  - propellerjobs
  - proplets
  - tasks
  - trainingrounds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - propeller.propeller.absmach.eu
  resources:
  - federatedjobs/status
  - propellerjobs/status
  - proplets/status
  - tasks/status
  - trainingrounds/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - propeller.propeller.absmach.eu
  resources:
  - propellerjobs/finalizers
  - proplets/finalizers
  - tasks/finalizers
  verbs:
  - update
